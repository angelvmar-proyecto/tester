<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traductor Ventas Pro</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-sec: #64748b; --primary: #2563eb; --danger: #ef4444; --success: #10b981; --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-sec: #94a3b8; --primary: #3b82f6; --border: #334155; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
        .btn-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
        textarea { height: 80px; resize: none; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .tab { padding: 8px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); white-space: nowrap; cursor: pointer; font-size: 13px; }
        .tab.active { background: var(--primary); color: white; }
        .phrase-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; position: relative; }
        .phrase-es { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text); border-left: 3px solid var(--primary); padding-left: 10px; }
        .phrase-en { font-size: 14px; color: var(--text-sec); font-style: italic; margin-bottom: 12px; border-left: 3px solid var(--success); padding-left: 10px; }
        .phrase-actions { display: flex; gap: 8px; }
        .phrase-actions .btn { padding: 10px; font-size: 13px; }
        .fav-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--border); }
        .fav-btn.active { color: #f59e0b; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s ease; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎙️ Ventas Pro</h1>
        <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
    <div class="card">
        <div class="controls">
            <select id="sourceLang"><option value="es">🇸 Español</option><option value="en">🇺🇸 English</option></select>
            <select id="targetLang"><option value="en">🇺 English</option><option value="es">🇸 Español</option></select>
        </div>
        <textarea id="inputText" placeholder="Escribe o toca el micrófono..."></textarea>
        <div class="controls">
            <button class="btn btn-danger" onclick="startDictation()">🎤 Hablar</button>
            <button class="btn btn-primary" onclick="translateText()">🔄 Traducir</button>
        </div>
        <textarea id="outputText" readonly placeholder="Traducción..."></textarea>
        <div class="controls">
            <button class="btn btn-success" onclick="speakOutput()">🔊 Escuchar Traducción</button>
            <button class="btn btn-secondary" onclick="copyText()">📋 Copiar</button>
        </div>
    </div>
    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 Buscar frase..." oninput="filterPhrases()">
        <div class="tabs">
            <button class="tab active" onclick="setCategory('all', this)"> Todas</button>
            <button class="tab" onclick="setCategory('licores', this)">🥃 Licores</button>
            <button class="tab" onclick="setCategory('perfumes', this)">🌸 Perfumes</button>
            <button class="tab" onclick="setCategory('cosmeticos', this)">💄 Cosméticos</button>
            <button class="tab" onclick="setCategory('skincare', this)">🧴 Skincare</button>
            <button class="tab" onclick="setCategory('moda', this)">👗 Moda</button>
            <button class="tab" onclick="setCategory('calzado', this)">👟 Calzado</button>
            <button class="tab" onclick="setCategory('tech', this)">📱 Tech</button>
            <button class="tab" onclick="setCategory('hogar', this)">🏠 Hogar</button>
            <button class="tab" onclick="setCategory('joyeria', this)">💍 Joyería</button>
            <button class="tab" onclick="setCategory('salud', this)">💊 Salud</button>
            <button class="tab" onclick="setCategory('bienvenida', this)">👋 Bienvenida</button>
            <button class="tab" onclick="setCategory('objeciones', this)">️ Objeciones</button>
            <button class="tab" onclick="setCategory('cierre', this)">🤝 Cierre</button>
            <button class="tab" onclick="setCategory('upselling', this)">📈 Upselling</button>
            <button class="tab" onclick="setCategory('postventa', this)">🔄 Postventa</button>
            <button class="tab" onclick="setCategory('fav', this)">⭐ Favoritos</button>
        </div>
        <div id="phrasesList"></div>
    </div>
    <div class="toast" id="toast">Mensaje</div>

    <script src="data1.js"></script>
    <script src="data2.js"></script>
    <script src="data3.js"></script>
    <script src="data4.js"></script>
    <script src="data5.js"></script>
    
    <script>
        const phrasesDB = [
            ...(typeof db1 !== 'undefined' ? db1 : []),
            ...(typeof db2 !== 'undefined' ? db2 : []),
            ...(typeof db3 !== 'undefined' ? db3 : []),
            ...(typeof db4 !== 'undefined' ? db4 : []),
            ...(typeof db5 !== 'undefined' ? db5 : [])
        ];

        let currentCat = 'all';
        let favorites = JSON.parse(localStorage.getItem('favPhrases') || '[]');

        // Inicializar Speech Synthesis
        window.speechSynthesis.cancel();

        function renderPhrases() {
            const list = document.getElementById('phrasesList');
            list.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = phrasesDB;
            
            if (currentCat === 'fav') {
                filtered = filtered.filter(p => favorites.includes(p.i));
                if (filtered.length === 0) {
                    list.innerHTML = '<p style="text-align:center;color:var(--text-sec);padding:20px">No hay favoritos aún. Toca la  en una frase.</p>';
                    return;
                }
            } else if (currentCat !== 'all') {
                filtered = filtered.filter(p => p.c === currentCat);
            }
            
            if (search) {
                filtered = filtered.filter(p => 
                    p.e.toLowerCase().includes(search) || 
                    p.n.toLowerCase().includes(search)
                );
            }

            filtered.forEach(p => {
                const isFav = favorites.includes(p.i);
                const div = document.createElement('div');
                div.className = 'phrase-item';
                
                // ORDEN CORRECTO: Primero español, luego inglés
                div.innerHTML = 
                    '<button class="fav-btn ' + (isFav ? 'active' : '') + '" onclick="toggleFav(' + p.i + ')">' + (isFav ? '★' : '☆') + '</button>' +
                    '<div class="phrase-es">🇸 ' + escapeHtml(p.e) + '</div>' +
                    '<div class="phrase-en">🇺🇸 ' + escapeHtml(p.n) + '</div>' +
                    '<div class="phrase-actions">' +
                    '<button class="btn btn-danger" onclick="speakText(\'' + escapeJs(p.e) + '\', \'es-ES\')">🔊 Español</button>' +
                    '<button class="btn btn-success" onclick="speakText(\'' + escapeJs(p.n) + '\', \'en-US\')">🔊 English</button>' +
                    '</div>';
                
                list.appendChild(div);
            });
            
            showToast('✅ ' + filtered.length + ' frases cargadas');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeJs(text) {
            return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
        }

        function toggleFav(id) {
            if (favorites.includes(id)) { 
                favorites = favorites.filter(f => f !== id); 
                showToast('⭐ Eliminado de favoritos'); 
            } else { 
                favorites.push(id); 
                showToast('⭐ Guardado en favoritos'); 
            }
            localStorage.setItem('favPhrases', JSON.stringify(favorites));
            renderPhrases();
        }

        function setCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderPhrases();
        }

        function filterPhrases() { 
            renderPhrases(); 
        }

        // Función de audio ROBUSTA para Android WebView
        function speakText(text, lang) {
            if (!text) {
                showToast('⚠️ No hay texto');
                return;
            }

            // Cancelar cualquier audio anterior
            window.speechSynthesis.cancel();
            
            // Crear utterance
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            // Manejadores de eventos
            utterance.onstart = function() {
                showToast('🔊 Reproduciendo...');
            };
            
            utterance.onend = function() {
                showToast('✅ Listo');
            };
            
            utterance.onerror = function(e) {
                showToast('❌ Error de audio: ' + e.error);
                console.error('Speech error:', e);
            };
            
            // Reproducir
            try {
                window.speechSynthesis.speak(utterance);
            } catch (err) {
                showToast('❌ Error: ' + err.message);
            }
        }

        function speakOutput() {
            const text = document.getElementById('outputText').value;
            const lang = document.getElementById('targetLang').value === 'es' ? 'es-ES' : 'en-US';
            speakText(text, lang);
        }

        async function translateText() {
            const text = document.getElementById('inputText').value;
            if (!text) {
                showToast('⚠️ Escribe algo primero');
                return;
            }
            
            document.getElementById('outputText').value = "Traduciendo...";
            
            try {
                const sourceLang = document.getElementById('sourceLang').value;
                const targetLang = document.getElementById('targetLang').value;
                
                const res = await fetch('https://api.mymemory.translated.net/get?q=' + 
                    encodeURIComponent(text) + '&langpair=' + sourceLang + '|' + targetLang);
                
                const data = await res.json();
                
                if (data.responseData && data.responseData.translatedText) {
                    document.getElementById('outputText').value = data.responseData.translatedText;
                    showToast('✅ Traducido');
                } else {
                    document.getElementById('outputText').value = "Error en la traducción";
                    showToast('❌ Error en traducción');
                }
            } catch (e) { 
                document.getElementById('outputText').value = "Error de conexión";
                showToast('❌ Sin conexión');
            }
        }

        function startDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                showToast('❌ Micrófono no soportado');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = document.getElementById('sourceLang').value === 'es' ? 'es-ES' : 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = function() {
                showToast('🎤 Escuchando...');
                document.getElementById('inputText').placeholder = " Habla ahora...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('inputText').value = transcript;
                document.getElementById('inputText').placeholder = "Escribe o toca el micrófono...";
                showToast('✅ Texto capturado');
                translateText();
            };

            recognition.onerror = function(event) {
                let errorMsg = 'Error: ' + event.error;
                if (event.error === 'not-allowed') {
                    errorMsg = '⛔ Permiso denegado. Ve a Ajustes > Apps > Traductor > Permisos > Micrófono';
                }
                showToast(errorMsg);
            };

            recognition.onend = function() {
                document.getElementById('inputText').placeholder = "Escribe o toca el micrófono...";
            };

            try {
                recognition.start();
            } catch (e) {
                showToast('⚠️ El micrófono ya está activo');
            }
        }

        function copyText() {
            const text = document.getElementById('outputText').value;
            if (!text || text === "Traduciendo..." || text === "Error de conexión") {
                showToast('⚠️ No hay texto para copiar');
                return;
            }
            
            navigator.clipboard.writeText(text)
                .then(() => showToast('📋 Copiado al portapapeles'))
                .catch(() => showToast('❌ Error al copiar'));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Inicializar tema
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '';
        
        // Renderizar frases al cargar
        renderPhrases();
    </script>
</body>
</html>
