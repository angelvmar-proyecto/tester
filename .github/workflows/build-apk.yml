name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Instalar dependencias de Node
      run: npm install

    - name: Sincronizar Capacitor (Genera archivos de Android)
      run: npx cap sync android

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK y aceptar licencias
      uses: android-actions/setup-android@v3

    - name: Dar permisos a Gradle
      run: chmod +x android/gradlew

    - name: Compilar APK (Debug) con reporte de errores detallado
      run: cd android && ./gradlew assembleDebug --stacktrace

    - name: Subir APK como resultado
      uses: actions/upload-artifact@v4
      with:
        name: TraductorVentasPro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Subir reporte de errores si falla (Opcional, para debugging)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Gradle-Error-Report
        path: android/build/reports/problems/problems-report.html
