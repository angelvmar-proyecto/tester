<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traductor Ventas Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#f0f4f8;padding:16px;max-width:480px;margin:0 auto;}
.app-container{background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,0.08);}
.audio-status{text-align:center;color:#4a5568;padding:10px;margin-bottom:16px;font-size:13px;}
.lang-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;}
.lang-box{flex:1;background:#f7f8fa;border-radius:12px;padding:12px;border:1px solid #e2e8f0;font-size:15px;font-weight:600;color:#2d3748;-webkit-appearance:none;appearance:none;outline:none;cursor:pointer;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:14px;}
.lang-box:focus{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,0.15);}
.lang-flag{font-size:20px;margin-right:8px;}
.swap-btn{width:44px;height:44px;border-radius:10px;background:#edf2f7;border:none;font-size:18px;cursor:pointer;}
.textarea-box{background:#f7f8fa;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e2e8f0;min-height:80px;}
textarea{width:100%;border:none;background:transparent;font-size:16px;resize:none;outline:none;color:#2d3748;}
.placeholder{color:#a0aec0;}
.btn-row-1{display:flex;gap:8px;margin-bottom:12px;}
.btn{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.btn-red{background:#ff4444;color:#fff;}
.btn-purple{background:#7c3aed;color:#fff;}
.btn-blue{background:#2563eb;color:#fff;}
.btn-row-2{display:flex;gap:8px;margin-bottom:16px;}
.btn-green{background:#10b981;color:#fff;flex:1.2;}
.btn-gray{background:#e5e7eb;color:#374151;flex:1;}
.btn-full{width:100%;background:#7c3aed;color:#fff;padding:11px;font-size:14px;margin-bottom:16px;}
.search-box{display:flex;align-items:center;background:#f7f8fa;border-radius:12px;padding:14px;margin-bottom:16px;border:1px solid #e2e8f0;}
.search-icon{margin-right:10px;color:#6b7280;}
.search-input{border:none;background:transparent;flex:1;font-size:16px;outline:none;color:#2d3748;}
.categories-section{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid #e5e7eb;}
.categories-title{font-size:15px;font-weight:600;color:#374151;margin-bottom:12px;}
.categories-grid{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.categories-grid::-webkit-scrollbar{height:4px;}
.categories-grid::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px;}
.category-tag{padding:8px 14px;background:#f3f4f6;border-radius:20px;font-size:14px;color:#4b5563;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;font-weight:500;}
.category-tag:hover{background:#e5e7eb;transform:translateY(-1px);}
.category-tag.active{background:#7c3aed;color:#fff;box-shadow:0 4px 12px rgba(124,58,237,0.35);}
.category-tag .cat-count{font-size:11px;opacity:0.65;font-weight:600;}
.category-tag.active .cat-count{opacity:0.9;}

.saved-list-section{margin-bottom:20px;}

/* === Grupos (vista "Todas") === */
.phrase-group{margin-bottom:8px;}
.group-header{display:flex;align-items:center;gap:8px;padding:12px 4px 8px;margin-top:12px;font-size:13px;font-weight:700;color:#4b5563;text-transform:uppercase;letter-spacing:0.6px;border-bottom:2px solid #ede9fe;margin-bottom:10px;cursor:pointer;}
.group-header:first-child{margin-top:0;}
.group-header:hover{color:#7c3aed;}
.group-icon{font-size:18px;}
.group-name{flex:1;}
.group-count{background:#ede9fe;color:#7c3aed;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:0;}

/* === Item de frase === */
.saved-item{display:flex;flex-direction:column;align-items:stretch;padding:12px 14px;background:#f9fafb;border-radius:10px;margin-bottom:8px;border-left:3px solid #7c3aed;gap:8px;transition:background .15s;}
.saved-item:hover{background:#f3f4f6;}
.saved-text{font-size:13px;color:#374151;word-break:break-word;line-height:1.4;}
.saved-text .es{font-size:13px;color:#6b7280;display:block;margin-top:4px;line-height:1.3;}
.saved-text .en{font-size:16px;font-weight:600;color:#1f2937;display:block;line-height:1.4;}
.saved-actions{display:flex;gap:6px;align-self:flex-end;align-items:center;}
.saved-btn{border:none;cursor:pointer;font-size:13px;font-weight:700;padding:8px 12px;border-radius:10px;line-height:1;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:4px;}
.btn-en{background:#2563eb;color:#fff;box-shadow:0 2px 6px rgba(37,99,235,0.3);}
.btn-es{background:#ea580c;color:#fff;box-shadow:0 2px 6px rgba(234,88,12,0.3);}
.saved-btn[data-act="use"], .saved-btn[data-act="del"]{background:#f3f4f6;color:#374151;}

.saved-btn:active{transform:scale(0.95);}

.add-btn{width:100%;padding:16px;background:#ff9500;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.hidden{display:none!important;}
.history-modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;}
.history-content{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:70vh;overflow-y:auto;}
.history-content h3{margin-bottom:12px;color:#2d3748;}
.history-item{padding:10px;background:#f9fafb;border-radius:8px;margin-bottom:8px;font-size:14px;color:#374151;word-break:break-word;border-left:3px solid #10b981;}
.history-item small{display:block;color:#9ca3af;margin-top:4px;font-size:11px;}
.history-close{background:#e5e7eb;border:none;padding:10px;border-radius:8px;width:100%;margin-top:12px;cursor:pointer;font-weight:600;}
.history-clear{background:#fee2e2;color:#991b1b;border:none;padding:8px;border-radius:8px;width:100%;margin-top:6px;cursor:pointer;font-weight:600;font-size:13px;}
.empty-state{color:#9ca3af;text-align:center;padding:24px;font-size:14px;}
</style>
</head>

<script>
const PROFILES = {
  deli: { name: '🛒 Deli / Tienda', cats: ['bienvenida', 'producto', 'precios', 'objeciones', 'cierre'] },
  housekeeping: { name: '🧹 Ama de Llaves', cats: ['housekeeping', 'areas_publicas', 'recepcion', 'informacion'] },
  botones: { name: '🧳 Botones/Concierge', cats: ['botones', 'recepcion', 'tour', 'informacion', 'taxfree'] },
  roomservice: { name: '🛎️ Room Service', cats: ['room_service', 'producto', 'precios', 'cierre'] },
  banquetes: { name: '🍽️ Banquetes', cats: ['banquetes', 'recepcion', 'areas_publicas'] },
  tours: { name: '🏝️ Guía de Tours', cats: ['tour', 'bienvenida', 'informacion', 'tirolesa', 'buceo', 'cuatrimotos', 'yates'] },
  spa: { name: '💆 Vendedor de Spa', cats: ['spa', 'bienvenida', 'precios', 'objeciones', 'cierre'] },
  renta: { name: '🚗 Agente de Renta', cats: ['renta_seguros', 'renta_infracciones', 'renta_percances', 'renta_quejas', 'recepcion'] },
  mesero: { name: '🍽️ Mesero / Rest.', cats: ['room_service', 'producto', 'bienvenida', 'cierre'] },
  tequila: { name: '🥂 Vendedor Tequila', cats: ['tequila', 'producto', 'precios', 'cierre', 'objeciones'] }

const CATEGORY_META = {
  licores:       { icon:'🥃', label:'Licores' },
  skincare:      { icon:'💆', label:'Skincare' },
  tech:          { icon:'📱', label:'Tech' },
  salud:         { icon:'💊', label:'Salud' },
  cierre:        { icon:'💳', label:'Cierre' },
  aeropuerto:    { icon:'✈️', label:'Aeropuerto' },
  regalos:       { icon:'🎁', label:'Regalos' },
  bienvenida:    { icon:'👋', label:'Bienvenida' },
  hostes:        { icon:'🛎️', label:'Hostes' },
  tirolesa:      { icon:'🪂', label:'Tirolesa' },
  buceo:         { icon:'🤿', label:'Buceo' },
  cuatrimotos:   { icon:'🏍️', label:'Cuatrimotos' },
  yates:         { icon:'⛵', label:'Yates' },
  tequila:       { icon:'🥂', label:'Tequila' },
  paquetes:      { icon:'📦', label:'Paquetes' },
  informacion:   { icon:'ℹ️', label:'Información' },
  concierge:     { icon:'🎩', label:'Concierge' },
  renta_reserva: { icon:'🚗', label:'Renta/Reserva' },
  housekeeping:  { icon:'🧹', label:'Ama de Llaves' },
  areas_publicas:{ icon:'🏊', label:'Áreas Públicas' },
  banquetes:     { icon:'🍽️', label:'Banquetes' },
  room_service:  { icon:'🛎️', label:'Room Service' },
  botones:       { icon:'🧳', label:'Botones' },
  recepcion:     { icon:'🛎️', label:'Recepción' },
  animacion:     { icon:'🎉', label:'Animación' },
  spa:           { icon:'💆', label:'Spa' },
  custom:        { icon:'⭐', label:'Personalizadas' }
};
function catMeta(c){
  if(CATEGORY_META[c]) return CATEGORY_META[c];
  return { icon:'📁', label: String(c||'otras').replace(/_/g,' ').replace(/\b\w/g, l=>l.toUpperCase()) };
}

const state = { inputLang:'es', outputLang:'en', currentCategory:'todas', activeProfile:null, phrases:[], searchQuery:'', history:[], collapsed:{} };
const el = {
  audioStatus:document.getElementById('audioStatus'),
  inputText:document.getElementById('inputText'),
  outputText:document.getElementById('outputText'),
  speakBtn:document.getElementById('speakBtn'),
  autoLangBtn:document.getElementById('autoLangBtn'),
  translateBtn:document.getElementById('translateBtn'),
  listenBtn:document.getElementById('listenBtn'),
  copyBtn:document.getElementById('copyBtn'),
  shareBtn:document.getElementById('shareBtn'),
  historyBtn:document.getElementById('historyBtn'),
  playAllBtn:document.getElementById('playAllBtn'),
  searchInput:document.getElementById('searchInput'),
  categoriesGrid:document.getElementById('categoriesGrid'),
  profilesGrid:document.getElementById('profilesGrid'),
  savedList:document.getElementById('savedList'),
  addPhraseBtn:document.getElementById('addPhraseBtn'),
  swapLangs:document.getElementById('swapLangs'),
  historyModal:document.getElementById('historyModal'),
  historyList:document.getElementById('historyList'),
  historyClose:document.getElementById('historyClose'),
  historyClear:document.getElementById('historyClear'),
  selIn:document.getElementById('selIn'),
  selOut:document.getElementById('selOut')
};

const hasCap = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const Plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
function safe(name){ try { return typeof eval(name) !== 'undefined' ? eval(name) : null; } catch(e){ return null; } }

function loadAllData(){
  const sources = [
    ['db1', safe('db1')], ['db2', safe('db2')], ['db3', safe('db3')], ['db4', safe('db4')],
    ['db5', safe('db5')], ['db6', safe('db6')], ['db7', safe('db7')], ['db8', safe('db8')],
    ['db9', safe('db9')], ['db10', safe('db10')], ['db11', safe('db11')],
    ['db9_tirolesa', safe('db9_tirolesa')], ['db10_buceo', safe('db10_buceo')],
    ['db11_cuatrimotos', safe('db11_cuatrimotos')], ['db12_yates', safe('db12_yates')],
    ['db13_tequila', safe('db13_tequila')], ['db14_paquetes', safe('db14_paquetes')],
    ['db15_informacion', safe('db15_informacion')], ['db16_extra', safe('db16_extra')],
    ['db17_extra', safe('db17_extra')], ['db18_extra', safe('db18_extra')],
    ['db19_hotel', safe('db19_hotel')]
  ];
  const collected = [];
  const seen = new Set();
  let activeSources = 0;
  sources.forEach(([name, arr]) => {
    if(!Array.isArray(arr) || arr.length === 0) return;
    activeSources++;
    arr.forEach(item => {
      if(!item || typeof item !== 'object') return;
      const text = (item.e || item.es || item.spanish || item.fraseEs || item.espanol || '').toString().trim();
      const translation = (item.n || item.en || item.english || item.traduccionEn || item.ingles || '').toString().trim();
      const category = (item.c || item.categoria || item.category || 'todas').toString().toLowerCase().trim();
      if(text) {
        const dedupKey = text.toLowerCase() + '|' + translation.toLowerCase();
        if (!seen.has(dedupKey)) {
          seen.add(dedupKey);
          collected.push({ text, translation, category, src: name });
        }
      }
    });
  });
  state.phrases = collected.map((p, idx) => ({ id: idx + 1, ...p }));
  el.audioStatus.textContent = '✅ ' + state.phrases.length + ' frases · ' + activeSources + ' fuentes';
}

function allCategories(){
  const map = {};
  state.phrases.forEach(p => { map[p.category] = (map[p.category] || 0) + 1; });
  return map;
}

function renderCategories(){
  const counts = allCategories();
  const cats = Object.keys(counts).sort((a,b) => counts[b] - counts[a]);
  const total = state.phrases.length;
  const html = ['todas', ...cats].map(c => {
    const active = (c === state.currentCategory && !state.activeProfile) ? ' active' : '';
    const meta = c === 'todas' ? { icon:'📚', label:'Todas' } : catMeta(c);
    const count = c === 'todas' ? total : counts[c];
    return '<span class="category-tag' + active + '" data-category="' + c + '">'
      + '<span>' + meta.icon + '</span><span>' + meta.label + '</span>'
      + '<span class="cat-count">' + count + '</span></span>';
  }).join('');
  el.categoriesGrid.innerHTML = html;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function phraseItemHTML(p){
  return '<div class="saved-item" data-id="' + p.id + '">'
    + '<div class="saved-text">'
    + '<span class="en">' + escapeHtml(p.translation) + '</span>'
    + '<span class="es">' + escapeHtml(p.text) + '</span>'
    + '</div>'
    + '<div class="saved-actions">'
    + '<button class="saved-btn btn-en" data-act="say-en" title="Escuchar inglés">🇺🇸 EN</button>'
    + '<button class="saved-btn btn-es" data-act="say-es" title="Escuchar español">🇪🇸 ES</button>'
    + '<button class="saved-btn" data-act="use" title="Llevar arriba">⬆️</button>'
    + '<button class="saved-btn" data-act="del" title="Eliminar">🗑️</button>'
    + '</div></div>';
}

function getVisiblePhrases(){
  let visible = state.phrases;
  if (state.activeProfile && PROFILES[state.activeProfile]) {
    visible = visible.filter(p => PROFILES[state.activeProfile].cats.includes(p.category));
  } else if (state.currentCategory !== 'todas'){
    visible = visible.filter(p => p.category === state.currentCategory);
  }
  const q = state.searchQuery.trim().toLowerCase();
  if(q){
    visible = visible.filter(p => p.text.toLowerCase().includes(q) || p.translation.toLowerCase().includes(q));
  }
  return visible;
}

function renderPhrases(){
  let visible = getVisiblePhrases();
  if(visible.length === 0){
    el.savedList.innerHTML = '<p class="empty-state">No hay frases en esta selección</p>';
    return;
  }
  let html = '';
  if (state.activeProfile && PROFILES[state.activeProfile]) {
    html += '<div class="group-header" style="cursor:default;"><span class="group-icon">💼</span><span class="group-name">' + PROFILES[state.activeProfile].name + '</span><span class="group-count">' + visible.length + '</span></div>';
  } else if(state.currentCategory !== 'todas'){
    const meta = catMeta(state.currentCategory);
    html += '<div class="group-header" style="cursor:default;"><span class="group-icon">' + meta.icon + '</span><span class="group-name">' + meta.label + '</span><span class="group-count">' + visible.length + '</span></div>';
  } else if(state.searchQuery){
    html += '<div class="group-header" style="cursor:default;"><span class="group-icon">🔍</span><span class="group-name">Resultados</span><span class="group-count">' + visible.length + '</span></div>';
  }
  
  if (!state.activeProfile && state.currentCategory === 'todas' && !state.searchQuery) {
    const groups = {};
    visible.forEach(p => { (groups[p.category] = groups[p.category] || []).push(p); });
    const order = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length);
    html += order.map(cat => {
      const meta = catMeta(cat);
      return '<div class="phrase-group"><div class="group-header"><span class="group-icon">' + meta.icon + '</span><span class="group-name">' + meta.label + '</span><span class="group-count">' + groups[cat].length + '</span></div>' + groups[cat].map(phraseItemHTML).join('') + '</div>';
    }).join('');
  } else {
    html += visible.map(phraseItemHTML).join('');
  }
  el.savedList.innerHTML = html;
}

async function ttsSpeak(text, lang){
  if(!text) return;
  try {
    if(hasCap && Plugins.TextToSpeech){
      await Plugins.TextToSpeech.speak({ text, lang: lang === 'en' ? 'en-US' : 'es-ES', rate: 0.95, category: 'playback' });
      return;
    }
  } catch(e){}
  if('speechSynthesis' in window){
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === 'en' ? 'en-US' : 'es-ES';
      u.onend = resolve;
      speechSynthesis.speak(u);
    });
  }
}

async function clipCopy(text){
  try { if(hasCap && Plugins.Clipboard){ await Plugins.Clipboard.write({ string: text }); return true; } } catch(e){}
  try { await navigator.clipboard.writeText(text); return true; } catch(e){ return false; }
}
async function haptic(){
  try { if(hasCap && Plugins.Haptics) await Plugins.Haptics.impact({ style: 'MEDIUM' }); } catch(e){}
}

function translateText(text){
  const q = text.toLowerCase().trim();
  if(!q) return null;
  const isEsToEn = state.inputLang === 'es';
  const from = p => isEsToEn ? p.text : p.translation;
  const to   = p => isEsToEn ? p.translation : p.text;
  let match = state.phrases.find(p => from(p).toLowerCase().trim() === q);
  if(match) return to(match);
  match = state.phrases.find(p => { const ft = from(p).toLowerCase(); return ft.includes(q) || q.includes(ft); });
  if(match) return to(match);
  const reverse = state.phrases.find(p => p.translation.toLowerCase().trim() === q || p.text.toLowerCase().trim() === q);
  if(reverse) return isEsToEn ? (reverse.translation.toLowerCase().trim() === q ? reverse.text : reverse.translation) : reverse.text;
  return null;
}

function updateLangUI(){
  if(el.selIn) el.selIn.value = state.inputLang;
  if(el.selOut) el.selOut.value = state.outputLang;
}

let continuousTimer = null;
let isPlayingAll = false;
let currentPlayIndex = 0;
let currentPlayList = [];

function stopContinuous() {
  isPlayingAll = false;
  if (continuousTimer) { clearTimeout(continuousTimer); continuousTimer = null; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (hasCap && Plugins.TextToSpeech) { try { Plugins.TextToSpeech.stop(); } catch(e){} }
  if (el.playAllBtn) {
    el.playAllBtn.innerHTML = '🔊 Escuchar Todo';
    el.playAllBtn.style.background = '#059669';
  }
}

function playNextPhrase() {
  if (!isPlayingAll || currentPlayIndex >= currentPlayList.length) {
    stopContinuous();
    return;
  }
  const p = currentPlayList[currentPlayIndex];
  const itemEl = document.querySelector('.saved-item[data-id="' + p.id + '"]');
  if (itemEl) itemEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(p.translation);
    u.lang = 'en-US';
    u.rate = 0.95;
    u.onend = () => { if (!isPlayingAll) return; currentPlayIndex++; continuousTimer = setTimeout(playNextPhrase, 3000); };
    u.onerror = () => { if (!isPlayingAll) return; currentPlayIndex++; continuousTimer = setTimeout(playNextPhrase, 3000); };
    window.speechSynthesis.speak(u);
  } else {
    ttsSpeak(p.translation, 'en').then(() => {
      if (!isPlayingAll) return; currentPlayIndex++; continuousTimer = setTimeout(playNextPhrase, 3000);
    });
  }
}

function setupEvents(){
  if (el.profilesGrid) {
    const profKeys = Object.keys(PROFILES);
    el.profilesGrid.innerHTML = profKeys.map(k => {
      const p = PROFILES[k];
      return '<span class="category-tag" data-profile="' + k + '" style="background:#fff7ed;border:1px solid #ea580c;color:#ea580c;font-weight:600;">' + p.name + '</span>';
    }).join('');

    el.profilesGrid.addEventListener('click', e => {
      const tag = e.target.closest('.category-tag');
      if(!tag) return;
      if (state.activeProfile === tag.dataset.profile) {
        state.activeProfile = null;
      } else {
        state.activeProfile = tag.dataset.profile;
        state.currentCategory = 'todas';
        state.searchQuery = '';
        el.searchInput.value = '';
      }
      el.categoriesGrid.querySelectorAll('.category-tag').forEach(t => t.classList.remove('active'));
      el.profilesGrid.querySelectorAll('.category-tag').forEach(t => t.classList.toggle('active', t.dataset.profile === state.activeProfile));
      renderCategories();
      renderPhrases();
      haptic();
    });
  }

  el.categoriesGrid.addEventListener('click', e => {
    const tag = e.target.closest('.category-tag');
    if(!tag) return;
    state.currentCategory = tag.dataset.category;
    state.activeProfile = null;
    if (el.profilesGrid) el.profilesGrid.querySelectorAll('.category-tag').forEach(t => t.classList.remove('active'));
    renderCategories();
    renderPhrases();
    haptic();
  });

  el.searchInput.addEventListener('input', e => {
    state.searchQuery = e.target.value;
    renderPhrases();
  });

  el.addPhraseBtn.addEventListener('click', () => {
    const t = prompt('Frase en español:');
    if(!t) return;
    const tr = prompt('Traducción al inglés:');
    if(!tr) return;
    const c = (prompt('Categoría (ej: buceo, custom...):') || 'custom').toLowerCase().trim();
    state.phrases.unshift({ id: Date.now(), text: t, translation: tr, category: c, src: 'user' });
    renderCategories();
    renderPhrases();
    haptic();
  });

  el.translateBtn.addEventListener('click', async () => {
    const t = el.inputText.value.trim();
    if(!t){ el.outputText.value = 'Escribe algo primero...'; return; }
    haptic();
    el.outputText.value = '🔄 Buscando en base de datos...';
    if ((state.inputLang === 'es' || state.inputLang === 'en') && (state.outputLang === 'es' || state.outputLang === 'en')) {
      const found = translateText(t);
      if(found){
        el.outputText.value = found;
        return;
      }
    }
    el.outputText.value = '🌐 Traduciendo con Google...';
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${state.inputLang}&tl=${state.outputLang}&dt=t&q=${encodeURIComponent(t)}`;
      const response = await fetch(url);
      const data = await response.json();
      let translatedText = '';
      if (data && data[0]) { data[0].forEach(item => { if (item[0]) translatedText += item[0]; }); }
      el.outputText.value = translatedText || '⚠️ No se pudo traducir.';
    } catch (e) {
      el.outputText.value = '❌ Error de red. Revisa tu conexión.';
    }
  });

  el.listenBtn.addEventListener('click', () => {
    const t = el.outputText.value;
    if(t && !t.startsWith('⚠️')) ttsSpeak(t, state.outputLang);
  });

  el.copyBtn.addEventListener('click', async () => {
    const t = el.outputText.value;
    if(!t || t.startsWith('⚠️')) return;
    const ok = await clipCopy(t);
    if(ok) haptic();
    alert(ok ? '✅ Copiado' : '❌ No se pudo copiar');
  });

  el.shareBtn.addEventListener('click', async () => {
    const t = el.outputText.value;
    if(!t || t.startsWith('⚠️')) return;
    if(navigator.share){ try { await navigator.share({ text: t }); } catch(e){} }
    else alert('Compartir no disponible');
  });

  el.swapLangs.addEventListener('click', () => {
    [el.inputText.value, el.outputText.value] = [el.outputText.value, el.inputText.value];
    [state.inputLang, state.outputLang] = [state.outputLang, state.inputLang];
    updateLangUI();
    haptic();
  });

  if (el.selIn) el.selIn.addEventListener('change', e => { state.inputLang = e.target.value; haptic(); });
  if (el.selOut) el.selOut.addEventListener('change', e => { state.outputLang = e.target.value; haptic(); });

  el.speakBtn.addEventListener('click', () => {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec) return alert('⚠️ Este WebView no soporta reconocimiento de voz');
    const R = new Rec();
    R.lang = state.inputLang === 'es' ? 'es-MX' : 'en-US';
    R.interimResults = false;
    el.speakBtn.style.opacity = '0.5';
    el.inputText.placeholder = '🎤 Escuchando...';
    R.onresult = e => { el.inputText.value = e.results[0][0].transcript; };
    R.onerror = () => {};
    R.onend = () => { el.speakBtn.style.opacity = '1'; el.inputText.placeholder = 'Escribe o toca el micrófono...'; };
    try { R.start(); } catch(e){ alert('No se pudo iniciar micrófono'); }
  });

  el.savedList.addEventListener('click', e => {
    const btn = e.target.closest('.saved-btn');
    const item = e.target.closest('.saved-item');
    if(!item) return;
    const id = parseInt(item.dataset.id, 10);
    const p = state.phrases.find(x => x.id === id);
    if(!p) return;
    const act = btn ? btn.dataset.act : 'use';
    if(act === 'use'){
      el.inputText.value = p.text;
      el.outputText.value = p.translation;
      haptic();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else if(act === 'say-es'){
      ttsSpeak(p.text, 'es'); haptic();
    } else if(act === 'say-en'){
      ttsSpeak(p.translation, 'en'); haptic();
    } else if(act === 'del'){
      if(confirm('¿Eliminar "' + p.text + '"? (solo en esta sesión)')){
        state.phrases = state.phrases.filter(x => x.id !== id);
        renderCategories();
        renderPhrases();
      }
    }
  });

  if (el.playAllBtn) {
    el.playAllBtn.addEventListener('click', () => {
      try {
        if (isPlayingAll) { stopContinuous(); return; }
        const visible = getVisiblePhrases();
        if (visible.length === 0) return alert('No hay frases para reproducir.');
        currentPlayList = visible;
        currentPlayIndex = 0;
        isPlayingAll = true;
        el.playAllBtn.innerHTML = '⏹️ Detener';
        el.playAllBtn.style.background = '#ef4444';
        haptic();
        playNextPhrase();
      } catch (err) {
        alert('Error en Escuchar Todo: ' + err.message);
        stopContinuous();
      }
    });
  }

  el.historyBtn.addEventListener('click', () => { 
    el.historyList.innerHTML = state.history.length
      ? state.history.map(h => '<div class="history-item"><strong>' + escapeHtml(h.input) + '</strong><br>↳ ' + escapeHtml(h.output) + '<small>' + new Date(h.ts).toLocaleString() + '</small></div>').join('')
      : '<p class="empty-state">Sin historial</p>';
    el.historyModal.classList.remove('hidden'); 
  });
  el.historyClose.addEventListener('click', () => el.historyModal.classList.add('hidden'));
  el.historyClear.addEventListener('click', () => {
    if(confirm('¿Borrar todo el historial?')){ state.history = []; try{localStorage.setItem('tvp_history','[]')}catch(e){}; el.historyList.innerHTML = '<p class="empty-state">Sin historial</p>'; }
  });
  el.historyModal.addEventListener('click', e => { if(e.target === el.historyModal) el.historyModal.classList.add('hidden'); });
}

document.addEventListener('DOMContentLoaded', () => {
  el.audioStatus.textContent = hasCap ? '✅ Capacitor nativo' : '✅ Modo web';
  loadAllData();
  try { state.history = JSON.parse(localStorage.getItem('tvp_history') || '[]'); } catch(e){ state.history = []; }
  renderCategories();
  renderPhrases();
  updateLangUI();
  setupEvents();
});
</script>
</body>
</html>
