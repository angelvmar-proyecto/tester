<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traductor Ventas Pro</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-sec: #64748b; --primary: #2563eb; --danger: #ef4444; --success: #10b981; --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-sec: #94a3b8; --primary: #3b82f6; --border: #334155; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
        .btn-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
        textarea { height: 80px; resize: none; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
        .tab { padding: 8px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); white-space: nowrap; cursor: pointer; font-size: 13px; }
        .tab.active { background: var(--primary); color: white; }
        .phrase-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; position: relative; }
        .phrase-es { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .phrase-en { font-size: 13px; color: var(--text-sec); font-style: italic; margin-bottom: 12px; }
        .phrase-actions { display: flex; gap: 8px; }
        .phrase-actions .btn { padding: 8px; font-size: 12px; }
        .fav-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--border); }
        .fav-btn.active { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎙️ Ventas Pro</h1>
        <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
    <div class="card">
        <div class="controls">
            <select id="sourceLang"><option value="es">🇪🇸 ES</option><option value="en">🇺🇸 EN</option></select>
            <select id="targetLang"><option value="en">🇺🇸 EN</option><option value="es">🇪🇸 ES</option></select>
        </div>
        <textarea id="inputText" placeholder="Escribe o toca el micrófono..."></textarea>
        <div class="controls">
            <button class="btn btn-danger" onclick="startDictation()">🎤 Voz</button>
            <button class="btn btn-primary" onclick="translateText()">🔄 Traducir</button>
        </div>
        <textarea id="outputText" readonly placeholder="Traducción..."></textarea>
        <div class="controls">
            <button class="btn btn-success" onclick="speakText('target')">🔊 Escuchar</button>
            <button class="btn btn-secondary" onclick="copyText()">📋 Copiar</button>
        </div>
    </div>
    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 Buscar..." oninput="filterPhrases()">
        <div class="tabs">
            <button class="tab active" onclick="setCategory('all', this)">📋 Todas</button>
            <button class="tab" onclick="setCategory('licores', this)">🥃 Licores</button>
            <button class="tab" onclick="setCategory('perfumes', this)">🌸 Perfumes</button>
            <button class="tab" onclick="setCategory('fav', this)">⭐ Favoritos</button>
        </div>
        <div id="phrasesList"></div>
    </div>

    <script src="data1.js"></script>
    <script src="data2.js"></script>
    <script src="data3.js"></script>
    <script src="data4.js"></script>
    <script src="data5.js"></script>
    
    <script>
        const phrasesDB = [
            ...(typeof db1 !== 'undefined' ? db1 : []),
            ...(typeof db2 !== 'undefined' ? db2 : []),
            ...(typeof db3 !== 'undefined' ? db3 : []),
            ...(typeof db4 !== 'undefined' ? db4 : []),
            ...(typeof db5 !== 'undefined' ? db5 : [])
        ];

        let currentCat = 'all';
        let favorites = JSON.parse(localStorage.getItem('favPhrases') || '[]');

        function renderPhrases() {
            const list = document.getElementById('phrasesList');
            list.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = phrasesDB;
            
            if (currentCat === 'fav') {
                filtered = filtered.filter(p => favorites.includes(p.i));
            } else if (currentCat !== 'all') {
                filtered = filtered.filter(p => p.c === currentCat);
            }
            
            if (search) filtered = filtered.filter(p => p.e.toLowerCase().includes(search) || p.n.toLowerCase().includes(search));

            filtered.forEach(p => {
                const isFav = favorites.includes(p.i);
                const div = document.createElement('div');
                div.className = 'phrase-item';
                div.innerHTML = '<button class="fav-btn ' + (isFav ? 'active' : '') + '" onclick="toggleFav(' + p.i + ')">' + (isFav ? '★' : '☆') + '</button>' +
                    '<div class="phrase-es">🇪🇸 ' + p.e + '</div>' +
                    '<div class="phrase-en">🇺🇸 ' + p.n + '</div>' +
                    '<div class="phrase-actions">' +
                    '<button class="btn btn-danger" onclick="speakPhrase(\'' + p.e.replace(/'/g, "\\'") + '\', \'es-ES\')">🔊 ES</button>' +
                    '<button class="btn btn-success" onclick="speakPhrase(\'' + p.n.replace(/'/g, "\\'") + '\', \'en-US\')">🔊 EN</button>' +
                    '</div>';
                list.appendChild(div);
            });
        }

        function toggleFav(id) {
            if (favorites.includes(id)) { 
                favorites = favorites.filter(f => f !== id); 
            } else { 
                favorites.push(id); 
            }
            localStorage.setItem('favPhrases', JSON.stringify(favorites));
            renderPhrases();
        }

        function setCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderPhrases();
        }

        function filterPhrases() { renderPhrases(); }

        function speakPhrase(text, lang) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang; 
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        async function translateText() {
            const text = document.getElementById('inputText').value;
            if (!text) return;
            document.getElementById('outputText').value = "Traduciendo...";
            try {
                const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + document.getElementById('sourceLang').value + '|' + document.getElementById('targetLang').value);
                const data = await res.json();
                document.getElementById('outputText').value = data.responseData.translatedText;
            } catch (e) { 
                document.getElementById('outputText').value = "Error de conexión."; 
            }
        }

        function startDictation() {
            if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = document.getElementById('sourceLang').value === 'es' ? 'es-ES' : 'en-US';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    document.getElementById('inputText').placeholder = "🎤 Escuchando...";
                };

                recognition.onresult = function(event) {
                    document.getElementById('inputText').value = event.results[0][0].transcript;
                    translateText();
                };

                recognition.onerror = function(event) {
                    alert("Error: " + event.error);
                };

                recognition.start();
            } else {
                alert("Tu navegador no soporta reconocimiento de voz.");
            }
        }

        function speakText(type) {
            const text = type === 'target' ? document.getElementById('outputText').value : document.getElementById('inputText').value;
            const lang = type === 'target' ? document.getElementById('targetLang').value : document.getElementById('sourceLang').value;
            if (!text) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang === 'es' ? 'es-ES' : 'en-US';
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function copyText() {
            const text = document.getElementById('outputText').value;
            navigator.clipboard.writeText(text);
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
        }

        renderPhrases();
    </script>
</body>
</html>
