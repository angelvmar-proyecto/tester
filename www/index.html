<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traductor Ventas Pro v5.0 Offline</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-sec: #64748b; --primary: #2563eb; --danger: #ef4444; --success: #10b981; --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-sec: #94a3b8; --primary: #3b82f6; --border: #334155; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; transition: background 0.3s, color 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
        .btn-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; box-shadow: var(--shadow); }
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
        textarea { height: 80px; resize: none; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-warning { background: #f59e0b; color: white; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: var(--text-sec); white-space: nowrap; cursor: pointer; font-size: 13px; font-weight: 500; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .phrase-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; position: relative; }
        .phrase-es { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .phrase-en { font-size: 13px; color: var(--text-sec); font-style: italic; margin-bottom: 12px; }
        .phrase-actions { display: flex; gap: 8px; }
        .phrase-actions .btn { padding: 8px; font-size: 12px; }
        .fav-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--border); }
        .fav-btn.active { color: #f59e0b; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s ease; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        /* Modo Práctica */
        .practice-mode { text-align: center; padding: 20px; }
        .practice-phrase { font-size: 1.3rem; font-weight: 600; margin: 20px 0; padding: 20px; background: var(--bg); border-radius: 12px; min-height: 120px; display: flex; align-items: center; justify-content: center; }
        .practice-controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .practice-controls .btn { flex: 0 0 auto; padding: 15px 25px; font-size: 16px; }
        .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; margin: 15px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎙️ Ventas Pro v5.0</h1>
        <button class="btn-icon" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>

    <!-- MODO PRÁCTICA OFFLINE -->
    <div class="card" id="practiceCard">
        <h3 style="margin-top:0">🎯 Modo Práctica (Offline)</h3>
        <p style="color:var(--text-sec);font-size:13px">Practica las frases sin necesidad de internet</p>
        
        <div class="controls">
            <select id="practiceCategory">
                <option value="all">📋 Todas las categorías</option>
                <option value="licores">🥃 Licores</option>
                <option value="perfumes">🌸 Perfumes</option>
                <option value="cosmeticos">💄 Cosméticos</option>
                <option value="skincare">🧴 Skincare</option>
                <option value="moda">👗 Moda</option>
                <option value="calzado">👟 Calzado</option>
                <option value="tech">📱 Tech</option>
                <option value="hogar">🏠 Hogar</option>
                <option value="joyeria">💍 Joyería</option>
                <option value="salud">💊 Salud</option>
                <option value="bienvenida">👋 Bienvenida</option>
                <option value="objeciones">🛡️ Objeciones</option>
                <option value="cierre">🤝 Cierre</option>
                <option value="upselling">📈 Upselling</option>
                <option value="postventa">🔄 Postventa</option>
                <option value="fav">⭐ Solo Favoritos</option>
            </select>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>

        <div class="practice-mode">
            <div class="practice-phrase" id="practicePhrase">
                Presiona "Iniciar" para comenzar
            </div>
            <div class="practice-controls">
                <button class="btn btn-warning" onclick="startPractice()">▶️ Iniciar</button>
                <button class="btn btn-success" onclick="speakCurrentPhrase()">🔊 Escuchar</button>
                <button class="btn btn-primary" onclick="nextPhrase()">⏭️ Siguiente</button>
            </div>
            <p style="margin-top:15px;color:var(--text-sec);font-size:13px">
                <span id="practiceCounter">0</span> frases practicadas
            </p>
        </div>
    </div>

    <!-- BANCO DE FRASES -->
    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 Buscar frase..." oninput="filterPhrases()">
        <div class="tabs" id="categoryTabs">
            <button class="tab active" onclick="setCategory('all', this)">📋 Todas</button>
            <button class="tab" onclick="setCategory('licores', this)">🥃 Licores</button>
            <button class="tab" onclick="setCategory('perfumes', this)">🌸 Perfumes</button>
            <button class="tab" onclick="setCategory('cosmeticos', this)">💄 Cosméticos</button>
            <button class="tab" onclick="setCategory('skincare', this)">🧴 Skincare</button>
            <button class="tab" onclick="setCategory('moda', this)">👗 Moda</button>
            <button class="tab" onclick="setCategory('calzado', this)">👟 Calzado</button>
            <button class="tab" onclick="setCategory('tech', this)">📱 Tech</button>
            <button class="tab" onclick="setCategory('hogar', this)">🏠 Hogar</button>
            <button class="tab" onclick="setCategory('joyeria', this)">💍 Joyería</button>
            <button class="tab" onclick="setCategory('salud', this)">💊 Salud</button>
            <button class="tab" onclick="setCategory('bienvenida', this)">👋 Bienvenida</button>
            <button class="tab" onclick="setCategory('objeciones', this)">🛡️ Objeciones</button>
            <button class="tab" onclick="setCategory('cierre', this)">🤝 Cierre</button>
            <button class="tab" onclick="setCategory('upselling', this)">📈 Upselling</button>
            <button class="tab" onclick="setCategory('postventa', this)">🔄 Postventa</button>
            <button class="tab" onclick="setCategory('fav', this)" style="color:#f59e0b">⭐ Favoritos</button>
        </div>
        <div id="phrasesList"></div>
    </div>

    <div class="toast" id="toast">Mensaje</div>

    <script src="data1.js"></script>
    <script src="data2.js"></script>
    <script src="data3.js"></script>
    <script src="data4.js"></script>
    <script src="data5.js"></script>
    
    <script>
        const phrasesDB = [
            ...(typeof db1 !== 'undefined' ? db1 : []),
            ...(typeof db2 !== 'undefined' ? db2 : []),
            ...(typeof db3 !== 'undefined' ? db3 : []),
            ...(typeof db4 !== 'undefined' ? db4 : []),
            ...(typeof db5 !== 'undefined' ? db5 : [])
        ];

        let currentCat = 'all';
        let favorites = JSON.parse(localStorage.getItem('favPhrases') || '[]');
        let practicePhrases = [];
        let currentPracticeIndex = 0;
        let practiceCount = 0;

        // ============ MODO PRÁCTICA ============
        function startPractice() {
            const category = document.getElementById('practiceCategory').value;
            
            if (category === 'fav') {
                practicePhrases = phrasesDB.filter(p => favorites.includes(p.i));
            } else if (category !== 'all') {
                practicePhrases = phrasesDB.filter(p => p.c === category);
            } else {
                practicePhrases = [...phrasesDB];
            }

            // Mezclar frases aleatoriamente
            practicePhrases = practicePhrases.sort(() => Math.random() - 0.5);
            currentPracticeIndex = 0;
            practiceCount = 0;
            
            if (practicePhrases.length === 0) {
                showToast('⚠️ No hay frases en esta categoría');
                return;
            }

            showToast('✅ Modo práctica iniciado');
            showCurrentPracticePhrase();
        }

        function showCurrentPracticePhrase() {
            if (currentPracticeIndex >= practicePhrases.length) {
                document.getElementById('practicePhrase').innerHTML = 
                    '🎉 ¡Práctica completada!<br><small>Presiona Iniciar para comenzar de nuevo</small>';
                showToast('🎉 ¡Excelente trabajo!');
                return;
            }

            const phrase = practicePhrases[currentPracticeIndex];
            document.getElementById('practicePhrase').innerHTML = 
                '<div style="width:100%">' +
                '<div style="margin-bottom:15px">🇪🇸 ' + phrase.e + '</div>' +
                '<div style="color:var(--text-sec);font-style:italic">🇺🇸 ' + phrase.n + '</div>' +
                '</div>';
            
            updateProgress();
        }

        function speakCurrentPhrase() {
            if (practicePhrases.length === 0 || currentPracticeIndex >= practicePhrases.length) {
                showToast('⚠️ Inicia el modo práctica primero');
                return;
            }

            const phrase = practicePhrases[currentPracticeIndex];
            
            // Primero español, luego inglés
            window.speechSynthesis.cancel();
            
            const utterEs = new SpeechSynthesisUtterance(phrase.e);
            utterEs.lang = 'es-ES';
            utterEs.rate = 0.9;
            
            const utterEn = new SpeechSynthesisUtterance(phrase.n);
            utterEn.lang = 'en-US';
            utterEn.rate = 0.9;
            
            utterEs.onend = () => {
                setTimeout(() => {
                    window.speechSynthesis.speak(utterEn);
                }, 500);
            };
            
            window.speechSynthesis.speak(utterEs);
            showToast('🔊 Reproduciendo...');
        }

        function nextPhrase() {
            if (practicePhrases.length === 0) return;
            
            currentPracticeIndex++;
            practiceCount++;
            document.getElementById('practiceCounter').textContent = practiceCount;
            showCurrentPracticePhrase();
        }

        function updateProgress() {
            const progress = (currentPracticeIndex / practicePhrases.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // ============ BANCO DE FRASES ============
        function renderPhrases() {
            const list = document.getElementById('phrasesList');
            list.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = phrasesDB;
            
            if (currentCat === 'fav') {
                filtered = filtered.filter(p => favorites.includes(p.i));
                if (filtered.length === 0) list.innerHTML = '<p style="text-align:center;color:var(--text-sec);padding:20px">No hay favoritos aún. Toca la ⭐ en una frase.</p>';
            } else if (currentCat !== 'all') {
                filtered = filtered.filter(p => p.c === currentCat);
            }
            
            if (search) filtered = filtered.filter(p => p.e.toLowerCase().includes(search) || p.n.toLowerCase().includes(search));

            filtered.forEach(p => {
                const isFav = favorites.includes(p.i);
                const div = document.createElement('div');
                div.className = 'phrase-item';
                div.innerHTML = '<button class="fav-btn ' + (isFav ? 'active' : '') + '" onclick="toggleFav(' + p.i + ')">' + (isFav ? '★' : '☆') + '</button>' +
                    '<div class="phrase-es">🇪🇸 ' + p.e + '</div>' +
                    '<div class="phrase-en">🇺🇸 ' + p.n + '</div>' +
                    '<div class="phrase-actions">' +
                    '<button class="btn btn-danger" onclick="speakPhrase(\'' + p.e.replace(/'/g, "\\'") + '\', \'es-ES\')">🔊 ES</button>' +
                    '<button class="btn btn-success" onclick="speakPhrase(\'' + p.n.replace(/'/g, "\\'") + '\', \'en-US\')">🔊 EN</button>' +
                    '<button class="btn btn-warning" onclick="speakBoth(\'' + p.e.replace(/'/g, "\\'") + '\', \'' + p.n.replace(/'/g, "\\'") + '\')">🔊 Ambos</button>' +
                    '</div>';
                list.appendChild(div);
            });
        }

        function toggleFav(id) {
            if (favorites.includes(id)) { 
                favorites = favorites.filter(f => f !== id); 
                showToast('Eliminado de favoritos'); 
            } else { 
                favorites.push(id); 
                showToast('Guardado en favoritos ⭐'); 
            }
            localStorage.setItem('favPhrases', JSON.stringify(favorites));
            renderPhrases();
        }

        function setCategory(cat, btn) {
            currentCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderPhrases();
        }

        function filterPhrases() { renderPhrases(); }

        function speakPhrase(text, lang) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang; 
            u.rate = 0.9;
            window.speechSynthesis.speak(u);
        }

        function speakBoth(es, en) {
            window.speechSynthesis.cancel();
            
            const utterEs = new SpeechSynthesisUtterance(es);
            utterEs.lang = 'es-ES';
            utterEs.rate = 0.9;
            
            const utterEn = new SpeechSynthesisUtterance(en);
            utterEn.lang = 'en-US';
            utterEn.rate = 0.9;
            
            utterEs.onend = () => {
                setTimeout(() => {
                    window.speechSynthesis.speak(utterEn);
                }, 500);
            };
            
            window.speechSynthesis.speak(utterEs);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        renderPhrases();
    </script>
</body>
</html>
