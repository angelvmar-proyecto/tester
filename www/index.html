<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Traductor Ventas Pro</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-sec: #64748b; --primary: #2563eb; --danger: #ef4444; --success: #10b981; --border: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --text-sec: #94a3b8; --primary: #3b82f6; --border: #334155; --shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; transition: background 0.3s, color 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
        .btn-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; box-shadow: var(--shadow); }
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .controls { display: flex; gap: 8px; margin-bottom: 12px; }
        select, input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none; }
        textarea { height: 80px; resize: none; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: var(--text-sec); white-space: nowrap; cursor: pointer; font-size: 13px; font-weight: 500; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .phrase-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; position: relative; }
        .phrase-es { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
        .phrase-en { font-size: 13px; color: var(--text-sec); font-style: italic; margin-bottom: 12px; }
        .phrase-actions { display: flex; gap: 8px; }
        .phrase-actions .btn { padding: 8px; font-size: 12px; }
        .fav-btn { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--border); }
        .fav-btn.active { color: #f59e0b; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s ease; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎙️ Ventas Pro</h1>
        <button class="btn-icon" id="themeBtn">🌙</button>
    </div>
    <div class="card">
        <div class="controls">
            <select id="sourceLang"><option value="es">🇪🇸 ES</option><option value="en">🇺🇸 EN</option></select>
            <span style="align-self:center">⇄</span>
            <select id="targetLang"><option value="en">🇺🇸 EN</option><option value="es">🇪🇸 ES</option></select>
        </div>
        <textarea id="inputText" placeholder="Escribe o toca el micrófono..."></textarea>
        <div class="controls" style="margin-top:10px">
            <button class="btn btn-danger" id="btnMic">🎤 Voz</button>
            <button class="btn btn-primary" id="btnTranslate">🔄 Traducir</button>
        </div>
        <textarea id="outputText" readonly placeholder="Traducción..."></textarea>
        <div class="controls" style="margin-top:10px">
            <button class="btn btn-success" id="btnSpeak">🔊 Escuchar</button>
            <button class="btn btn-secondary" id="btnCopy">📋 Copiar</button>
        </div>
    </div>
    <div class="card">
        <input type="text" id="searchInput" placeholder="🔍 Buscar frase...">
        <div class="tabs" id="categoryTabs">
            <button class="tab active" data-cat="all">📋 Todas</button>
            <button class="tab" data-cat="licores">🥃 Licores</button>
            <button class="tab" data-cat="perfumes">🌸 Perfumes</button>
            <button class="tab" data-cat="cosmeticos">💄 Cosméticos</button>
            <button class="tab" data-cat="skincare">🧴 Skincare</button>
            <button class="tab" data-cat="moda">👗 Moda</button>
            <button class="tab" data-cat="calzado">👟 Calzado</button>
            <button class="tab" data-cat="tech">📱 Tech</button>
            <button class="tab" data-cat="hogar">🏠 Hogar</button>
            <button class="tab" data-cat="joyeria">💍 Joyería</button>
            <button class="tab" data-cat="salud">💊 Salud</button>
            <button class="tab" data-cat="bienvenida">👋 Bienvenida</button>
            <button class="tab" data-cat="objeciones">🛡️ Objeciones</button>
            <button class="tab" data-cat="cierre">🤝 Cierre</button>
            <button class="tab" data-cat="upselling">📈 Upselling</button>
            <button class="tab" data-cat="postventa">🔄 Postventa</button>
            <button class="tab" data-cat="fav" style="color:#f59e0b">⭐ Favoritos</button>
        </div>
        <div id="phrasesList"></div>
    </div>
    <div class="toast" id="toast">Mensaje</div>

    <script src="data1.js"></script>
    <script src="data2.js"></script>
    <script src="data3.js"></script>
    <script src="data4.js"></script>
    <script src="data5.js"></script>
    
    <script>
        // Unir las 5 bases de datos
        const phrasesDB = []
            .concat(typeof db1 !== 'undefined' ? db1 : [])
            .concat(typeof db2 !== 'undefined' ? db2 : [])
            .concat(typeof db3 !== 'undefined' ? db3 : [])
            .concat(typeof db4 !== 'undefined' ? db4 : [])
            .concat(typeof db5 !== 'undefined' ? db5 : []);

        let currentCat = 'all';
        let favorites = JSON.parse(localStorage.getItem('favPhrases') || '[]');

        // Mapa para acceder rápido por ID
        const phrasesMap = {};
        phrasesDB.forEach(p => { phrasesMap[p.i] = p; });

        function renderPhrases() {
            const list = document.getElementById('phrasesList');
            list.innerHTML = '';
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = phrasesDB;
            
            if (currentCat === 'fav') {
                filtered = phrasesDB.filter(p => favorites.includes(p.i));
                if (filtered.length === 0) {
                    list.innerHTML = '<p style="text-align:center;color:var(--text-sec);padding:20px">No hay favoritos aún. Toca la ⭐ en una frase.</p>';
                    return;
                }
            } else if (currentCat !== 'all') {
                filtered = phrasesDB.filter(p => p.c === currentCat);
            }
            
            if (search) {
                filtered = filtered.filter(p => 
                    p.e.toLowerCase().includes(search) || 
                    p.n.toLowerCase().includes(search)
                );
            }

            // Renderizado usando data-attributes (sin comillas en onclick)
            const fragment = document.createDocumentFragment();
            filtered.forEach(p => {
                const isFav = favorites.includes(p.i);
                const div = document.createElement('div');
                div.className = 'phrase-item';
                div.dataset.id = p.i;
                
                div.innerHTML = 
                    '<button class="fav-btn ' + (isFav ? 'active' : '') + '" data-action="fav">⭐</button>' +
                    '<div class="phrase-es">🇪🇸 ' + escapeHtml(p.e) + '</div>' +
                    '<div class="phrase-en">🇺🇸 ' + escapeHtml(p.n) + '</div>' +
                    '<div class="phrase-actions">' +
                    '<button class="btn btn-danger" data-action="speak-es">🔊 ES</button>' +
                    '<button class="btn btn-success" data-action="speak-en">🔊 EN</button>' +
                    '<button class="btn btn-secondary" data-action="use">✏️ Usar</button>' +
                    '</div>';
                
                fragment.appendChild(div);
            });
            list.appendChild(fragment);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event delegation: un solo listener para todos los botones de frases
        document.getElementById('phrasesList').addEventListener('click', function(e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            
            const item = btn.closest('.phrase-item');
            const id = parseInt(item.dataset.id);
            const phrase = phrasesMap[id];
            if (!phrase) return;
            
            const action = btn.dataset.action;
            
            if (action === 'fav') {
                toggleFav(id);
            } else if (action === 'speak-es') {
                speakPhrase(phrase.e, 'es-ES');
            } else if (action === 'speak-en') {
                speakPhrase(phrase.n, 'en-US');
            } else if (action === 'use') {
                loadToTranslator(phrase.e);
            }
        });

        function toggleFav(id) {
            if (favorites.includes(id)) { 
                favorites = favorites.filter(f => f !== id); 
                showToast('Eliminado de favoritos'); 
            } else { 
                favorites.push(id); 
                showToast('⭐ Guardado en favoritos'); 
            }
            localStorage.setItem('favPhrases', JSON.stringify(favorites));
            renderPhrases();
        }

        // Tabs de categorías
        document.getElementById('categoryTabs').addEventListener('click', function(e) {
            const tab = e.target.closest('.tab');
            if (!tab) return;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentCat = tab.dataset.cat;
            renderPhrases();
        });

        // Búsqueda
        document.getElementById('searchInput').addEventListener('input', renderPhrases);

        function speakPhrase(text, lang) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = lang; 
            u.rate = 0.9;
            u.onend = () => showToast('✅ Listo');
            u.onerror = (e) => showToast('❌ Error de voz');
            window.speechSynthesis.speak(u);
            showToast('🔊 Reproduciendo...');
        }

        function loadToTranslator(text) {
            document.getElementById('inputText').value = text;
            document.getElementById('sourceLang').value = 'es';
            document.getElementById('targetLang').value = 'en';
            translateText();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function translateText() {
            const text = document.getElementById('inputText').value;
            if (!text) return;
            document.getElementById('outputText').value = "Traduciendo...";
            try {
                const res = await fetch('https://api.mymemory.translated.net/get?q=' + 
                    encodeURIComponent(text) + '&langpair=' + 
                    document.getElementById('sourceLang').value + '|' + 
                    document.getElementById('targetLang').value);
                const data = await res.json();
                document.getElementById('outputText').value = data.responseData.translatedText;
            } catch (e) { 
                document.getElementById('outputText').value = "Error de conexión."; 
            }
        }

        function startDictation() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { 
                showToast('❌ Micrófono no soportado en este navegador'); 
                return; 
            }
            const rec = new SR();
            rec.lang = document.getElementById('sourceLang').value === 'es' ? 'es-ES' : 'en-US';
            rec.continuous = false;
            rec.interimResults = false;
            
            rec.onstart = () => showToast('🎤 Escuchando...');
            rec.onresult = (e) => { 
                document.getElementById('inputText').value = e.results[0][0].transcript; 
                translateText(); 
            };
            rec.onerror = (e) => showToast('❌ Error mic: ' + e.error);
            rec.onend = () => showToast('🎤 Listo');
            
            try {
                rec.start();
            } catch (err) {
                showToast('❌ No se pudo iniciar el micrófono');
            }
        }

        function speakText(type) {
            const text = type === 'target' ? 
                document.getElementById('outputText').value : 
                document.getElementById('inputText').value;
            const lang = type === 'target' ? 
                document.getElementById('targetLang').value : 
                document.getElementById('sourceLang').value;
            if (!text) { showToast('⚠️ No hay texto'); return; }
            speakPhrase(text, lang === 'es' ? 'es-ES' : 'en-US');
        }

        function copyText() {
            const text = document.getElementById('outputText').value;
            if (!text) { showToast('⚠️ No hay texto'); return; }
            navigator.clipboard.writeText(text)
                .then(() => showToast('📋 Copiado'))
                .catch(() => showToast('❌ Error al copiar'));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Inicializar listeners de botones principales
        document.getElementById('themeBtn').addEventListener('click', toggleTheme);
        document.getElementById('btnMic').addEventListener('click', startDictation);
        document.getElementById('btnTranslate').addEventListener('click', translateText);
        document.getElementById('btnSpeak').addEventListener('click', () => speakText('target'));
        document.getElementById('btnCopy').addEventListener('click', copyText);

        // Tema inicial
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        // Renderizar cuando todo esté cargado
        if (phrasesDB.length > 0) {
            renderPhrases();
            showToast('✅ ' + phrasesDB.length + ' frases cargadas');
        } else {
            showToast('⚠️ No se cargaron las frases');
        }
    </script>
</body>
</html>
